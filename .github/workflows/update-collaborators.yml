name: 🧑‍🤝‍🧑 Update Collaborators in README

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # runs daily at midnight UTC


jobs:
  update-collaborators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Get public repos
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/users/heubert-69/repos?per_page=100 > repos.json

      - name: Get all collaborators
        run: |
          collabs_file=collaborators.md
          echo '<table><tr>' > $collabs_file

          for repo in $(jq -r '.[].name' repos.json); do
            echo "🔍 Scanning $repo"
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/heubert-69/$repo/collaborators?per_page=100 \
              | jq -r '.[].login'
          done | sort -u | grep -v '^heubert-69$' > raw_collabs.txt

          while read user; do
            echo "<td align=\"center\"><a href=\"https://github.com/$user\"><img src=\"https://avatars.githubusercontent.com/$user\" width=\"70px\" /><br /><sub><b>$user</b></sub></a></td>" >> $collabs_file
          done < raw_collabs.txt

          echo '</tr></table>' >> $collabs_file

      - name: Inject into README.md
        run: |
          awk '/<!-- collaborators-start -->/{print; system("cat collaborators.md"); skip=1; next}
               /<!-- collaborators-end -->/{skip=0; print; next}
               !skip' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: '🔄 Updated collaborators list'
          github_token: ${{ secrets.PAT_TOKEN }}'
