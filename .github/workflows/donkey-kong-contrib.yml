name: 🦍 Deploy Donkey Kong GitHub Animation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC

jobs:
  deploy-donkeykong:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Prepare animation (optional build step)
        run: |
          echo "✅ Animation asset assumed to be ready: github-contribution-donkeykong.svg"
          # If needed: generate or copy your SVG to the root here

      - name: Deploy to GitHub Pages (output branch)
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .  # assumes SVG is in root of repo
          keep_history: false
          allow_empty_commit: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
